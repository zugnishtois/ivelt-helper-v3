<!DOCTYPE html>
<html lang="yi" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>iVelt Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 270px;
      font-family: Verdana, Arial, Helvetica, sans-serif;
      background: #ECF1F2;
      color: #333;
      direction: rtl;
      font-size: 12px;
    }

    .popup-header {
      padding: 10px 14px;
      background: linear-gradient(180deg, #12A3EB 0%, #1675B9 100%);
      color: #fff;
      border-bottom: 1px solid #0c75a6;
      text-align: center;
      box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset;
    }
    .popup-header h1 {
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    }
    .popup-header .subtitle {
      font-size: 10px;
      color: rgba(255,255,255,0.85);
      margin-top: 2px;
    }

    .main-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 8px;
      padding: 7px 10px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E5EEF4 100%);
      border: 1px solid #B9C2C9;
      border-radius: 4px;
      cursor: pointer;
      color: #105289;
      font-size: 12px;
      font-family: inherit;
      font-weight: bold;
      width: calc(100% - 16px);
      box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset;
      transition: background 0.12s, border-color 0.12s;
    }
    .main-link:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, #D0DEE9 100%);
      border-color: #105289;
    }
    .main-link:active { background: #D0DEE9; }

    .actions-list {
      padding: 0 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      color: #444;
      font-size: 12px;
      font-family: inherit;
      text-align: right;
      width: 100%;
    }
    .action-btn:hover {
      background: #DCE8F0;
      border-color: #B9C2C9;
      color: #105289;
    }
    .action-btn .icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      color: #105289;
    }

    .divider {
      height: 1px;
      background: #B9C2C9;
      margin: 6px 8px;
    }

    .footer-row {
      display: flex;
      gap: 4px;
      padding: 4px 8px 8px;
    }
    .footer-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E5EEF4 100%);
      border: 1px solid #B9C2C9;
      border-radius: 3px;
      cursor: pointer;
      color: #105289;
      font-size: 11px;
      font-family: inherit;
    }
    .footer-btn:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, #D0DEE9 100%);
      border-color: #105289;
    }

    /* Yiddish24 mini-player retains a slightly modern feel — info widget */
    .y24-player {
      background: #fff;
      border: 1px solid #B9C2C9;
      border-radius: 4px;
      margin: 8px;
      padding: 8px;
      display: none;
    }
    .y24-player.active { display: block; }
    .y24-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .y24-icon { background: #dc2626; color: white; font-size: 9px; font-weight: bold; padding: 2px 4px; border-radius: 3px; }
    .y24-title { font-size: 11px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .y24-controls { display: flex; align-items: center; gap: 8px; }
    .y24-playbtn { background: none; border: none; color: #105289; cursor: pointer; font-size: 1rem; padding: 2px 4px; }
    .y24-playbtn:hover { color: #1675B9; }
    .y24-progress-container { flex: 1; height: 4px; background: #DCE8F0; border-radius: 2px; position: relative; cursor: pointer; }
    .y24-progress-bar { position: absolute; left: 0; right: auto; top: 0; height: 100%; background: linear-gradient(90deg, #12A3EB, #1675B9); border-radius: 2px; width: 0%; }
    .y24-time { font-size: 10px; color: #777; font-variant-numeric: tabular-nums; min-width: 35px; text-align: left; }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>iVelt Pro</h1>
    <div class="subtitle">v1.0.0</div>
  </div>

  <div id="y24-player" class="y24-player">
    <div class="y24-header">
      <div class="y24-icon">Y24</div>
      <div class="y24-title" id="y24-title">לאדירט...</div>
    </div>
    <div class="y24-controls">
      <button class="y24-playbtn" id="y24-playpause">▶</button>
      <div class="y24-progress-container" id="y24-progress-bg">
        <div class="y24-progress-bar" id="y24-progress"></div>
      </div>
      <div class="y24-time" id="y24-time">0:00</div>
    </div>
  </div>

  <button class="main-link" id="openDefault">
    <span>📋</span>
    <span>אקטיווע אשכולות</span>
  </button>

  <div class="actions-list">
    <button class="action-btn" id="openHome">
      <span class="icon">🏠</span>
      <span>הויפט בלאט</span>
    </button>
    <div id="customLinksArea"></div>
    <button class="action-btn" id="quickSignIn" style="display:none;">
      <span class="icon">🔑</span>
      <span>לאג אריין</span>
    </button>
    <button class="action-btn" id="emergencySignOut" style="display:none;">
      <span class="icon">🚪</span>
      <span>עמערדזשענסי סיין ארויס</span>
    </button>
  </div>

  <div class="divider"></div>

  <div class="footer-row">
    <button class="footer-btn" id="openSettings">
      <span>⚙️</span>
      <span>סעטינגס</span>
    </button>
    <button class="footer-btn" id="openHelp">
      <span>❓</span>
      <span>הילף</span>
    </button>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
